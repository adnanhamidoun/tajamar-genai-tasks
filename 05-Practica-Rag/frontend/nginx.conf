server {
    listen 80;
    server_name localhost;

    # SOLUCIÓN AL ERROR 413: Permitir subida de archivos de hasta 50MB
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejorar rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy inverso: Reenviar todas las peticiones /api/v1/* al backend real de Azure
    location /api/v1/ {
        proxy_pass https://aisla-backend-adnan-ekajgfa4huhagah7.westeurope-01.azurewebsites.net/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host aisla-backend-adnan-ekajgfa4huhagah7.westeurope-01.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Tiempos de espera largos para procesos de IA que tardan en responder
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        # Vital para que React Router funcione y no de 404 al refrescar
        try_files $uri $uri/ /index.html;
    }

    # Cache de archivos estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}