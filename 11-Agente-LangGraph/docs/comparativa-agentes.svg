<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Comparativa entre agente LangGraph normal y Deep Agent</title>
  <desc id="desc">Esquema visual que compara un agente normal de LangGraph con un deep agent construido con create_deep_agent.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .panel { stroke-width: 2; rx: 18; filter: url(#shadow); }
      .panel-title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .box { stroke-width: 2; rx: 12; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tag { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .bold { font: 700 15px Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text x="70" y="65" class="title">Agente normal vs Deep Agent</text>
  <text x="70" y="98" class="subtitle">Dos formas de construir agentes con LangGraph: una explicita y controlada, otra mas autonoma y con herramientas.</text>

  <rect x="60" y="135" width="510" height="545" rx="18" fill="#eef6ff" stroke="#2563eb" class="panel"/>
  <text x="315" y="180" text-anchor="middle" class="panel-title">Agente LangGraph normal</text>
  <rect x="220" y="198" width="190" height="30" rx="15" fill="#2563eb"/>
  <text x="315" y="218" text-anchor="middle" class="tag">src/agent.py</text>

  <rect x="115" y="270" width="160" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="195" y="298" text-anchor="middle" class="box-title">Usuario</text>
  <text x="195" y="321" text-anchor="middle" class="box-text">Peticion</text>

  <rect x="350" y="270" width="160" height="70" rx="12" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="430" y="298" text-anchor="middle" class="box-title">Clasifica</text>
  <text x="430" y="321" text-anchor="middle" class="box-text">intent</text>

  <path d="M275 305 H350" class="arrow"/>

  <rect x="95" y="405" width="130" height="66" rx="12" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="160" y="432" text-anchor="middle" class="box-title">plan</text>
  <text x="160" y="454" text-anchor="middle" class="box-text">ruta fija</text>

  <rect x="250" y="405" width="130" height="66" rx="12" fill="#ede9fe" stroke="#7c3aed" class="box"/>
  <text x="315" y="432" text-anchor="middle" class="box-title">ideas</text>
  <text x="315" y="454" text-anchor="middle" class="box-text">ruta fija</text>

  <rect x="405" y="405" width="130" height="66" rx="12" fill="#ffe4e6" stroke="#e11d48" class="box"/>
  <text x="470" y="432" text-anchor="middle" class="box-title">resumen</text>
  <text x="470" y="454" text-anchor="middle" class="box-text">ruta fija</text>

  <path d="M400 340 C350 370 210 370 160 405" class="arrow"/>
  <path d="M430 340 C410 375 340 375 315 405" class="arrow"/>
  <path d="M460 340 C500 370 500 375 470 405" class="arrow"/>

  <rect x="190" y="535" width="250" height="70" rx="12" fill="#ccfbf1" stroke="#0f766e" class="box"/>
  <text x="315" y="563" text-anchor="middle" class="box-title">Modelo Azure Foundry</text>
  <text x="315" y="586" text-anchor="middle" class="box-text">Genera la respuesta</text>

  <path d="M160 471 C190 515 250 520 285 535" class="arrow"/>
  <path d="M315 471 V535" class="arrow"/>
  <path d="M470 471 C440 515 375 520 345 535" class="arrow"/>

  <text x="95" y="640" class="bold">Idea:</text>
  <text x="140" y="640" class="small">nosotros definimos el grafo y sus rutas.</text>

  <rect x="630" y="135" width="510" height="545" rx="18" fill="#f5f3ff" stroke="#7c3aed" class="panel"/>
  <text x="885" y="180" text-anchor="middle" class="panel-title">Deep Agent</text>
  <rect x="790" y="198" width="190" height="30" rx="15" fill="#7c3aed"/>
  <text x="885" y="218" text-anchor="middle" class="tag">src/deep_agent_study.py</text>

  <rect x="690" y="270" width="160" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="770" y="298" text-anchor="middle" class="box-title">Usuario</text>
  <text x="770" y="321" text-anchor="middle" class="box-text">Objetivo amplio</text>

  <rect x="925" y="255" width="170" height="100" rx="12" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="1010" y="292" text-anchor="middle" class="box-title">Deep Agent</text>
  <text x="1010" y="315" text-anchor="middle" class="box-text">planifica</text>
  <text x="1010" y="337" text-anchor="middle" class="box-text">y decide herramientas</text>

  <path d="M850 305 H925" class="arrow"/>

  <rect x="690" y="420" width="130" height="66" rx="12" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="755" y="447" text-anchor="middle" class="box-title">tiempo</text>
  <text x="755" y="469" text-anchor="middle" class="box-text">tool</text>

  <rect x="850" y="420" width="130" height="66" rx="12" fill="#ede9fe" stroke="#7c3aed" class="box"/>
  <text x="915" y="447" text-anchor="middle" class="box-title">checklist</text>
  <text x="915" y="469" text-anchor="middle" class="box-text">tool</text>

  <rect x="1010" y="420" width="130" height="66" rx="12" fill="#ffe4e6" stroke="#e11d48" class="box"/>
  <text x="1075" y="447" text-anchor="middle" class="box-title">guardar</text>
  <text x="1075" y="469" text-anchor="middle" class="box-text">tool</text>

  <path d="M975 355 C910 385 800 390 755 420" class="arrow"/>
  <path d="M1010 355 C980 390 940 395 915 420" class="arrow"/>
  <path d="M1045 355 C1090 385 1095 395 1075 420" class="arrow"/>

  <rect x="760" y="535" width="250" height="70" rx="12" fill="#ccfbf1" stroke="#0f766e" class="box"/>
  <text x="885" y="563" text-anchor="middle" class="box-title">Modelo + herramientas</text>
  <text x="885" y="586" text-anchor="middle" class="box-text">Respuesta mas autonoma</text>

  <path d="M755 486 C790 520 840 525 865 535" class="arrow"/>
  <path d="M915 486 C910 510 895 520 890 535" class="arrow"/>
  <path d="M1075 486 C1035 520 955 525 910 535" class="arrow"/>

  <text x="665" y="640" class="bold">Idea:</text>
  <text x="710" y="640" class="small">el agente decide pasos y usa herramientas internas.</text>
</svg>
