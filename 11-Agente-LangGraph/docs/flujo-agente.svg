<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Flujo del agente Chispa con LangGraph</title>
  <desc id="desc">Diagrama visual del flujo START, clasificacion de intencion, rutas plan, ideas y resumen, llamada al modelo de Azure AI Foundry y trazas en LangSmith.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 36px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 14; filter: url(#shadow); }
      .box-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #475569; }
      .pill { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .small { font: 400 13px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>

  <text x="70" y="70" class="title">Flujo del agente Chispa</text>
  <text x="70" y="102" class="subtitle">LangGraph decide la ruta, Azure AI Foundry genera la respuesta y LangSmith registra las trazas.</text>

  <rect x="70" y="150" width="180" height="88" rx="14" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="160" y="187" text-anchor="middle" class="box-title">Usuario</text>
  <text x="160" y="214" text-anchor="middle" class="box-text">Escribe una peticion</text>

  <rect x="330" y="150" width="210" height="88" rx="14" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="435" y="187" text-anchor="middle" class="box-title">START</text>
  <text x="435" y="214" text-anchor="middle" class="box-text">Comienza el grafo</text>

  <rect x="620" y="130" width="280" height="128" rx="14" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="760" y="172" text-anchor="middle" class="box-title">classify_intent</text>
  <text x="760" y="201" text-anchor="middle" class="box-text">Detecta la intencion</text>
  <text x="760" y="224" text-anchor="middle" class="box-text">plan, ideas o resumen</text>

  <path d="M250 194 H330" class="arrow"/>
  <path d="M540 194 H620" class="arrow"/>

  <rect x="160" y="350" width="220" height="108" rx="14" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="270" y="389" text-anchor="middle" class="box-title">plan_node</text>
  <text x="270" y="417" text-anchor="middle" class="box-text">Crea un plan breve</text>
  <text x="270" y="440" text-anchor="middle" class="box-text">con pasos accionables</text>

  <rect x="490" y="350" width="220" height="108" rx="14" fill="#ede9fe" stroke="#7c3aed" class="box"/>
  <text x="600" y="389" text-anchor="middle" class="box-title">ideas_node</text>
  <text x="600" y="417" text-anchor="middle" class="box-text">Genera ideas utiles</text>
  <text x="600" y="440" text-anchor="middle" class="box-text">y creativas</text>

  <rect x="820" y="350" width="220" height="108" rx="14" fill="#ffe4e6" stroke="#e11d48" class="box"/>
  <text x="930" y="389" text-anchor="middle" class="box-title">resumen_node</text>
  <text x="930" y="417" text-anchor="middle" class="box-text">Resume y extrae</text>
  <text x="930" y="440" text-anchor="middle" class="box-text">puntos clave</text>

  <path d="M700 258 C590 300 380 300 300 350" class="arrow"/>
  <path d="M760 258 V350" class="arrow"/>
  <path d="M820 258 C910 300 970 300 950 350" class="arrow"/>

  <rect x="360" y="555" width="280" height="92" rx="14" fill="#ccfbf1" stroke="#0f766e" class="box"/>
  <text x="500" y="591" text-anchor="middle" class="box-title">Azure AI Foundry</text>
  <text x="500" y="619" text-anchor="middle" class="box-text">Deployment del modelo</text>

  <rect x="745" y="555" width="260" height="92" rx="14" fill="#e2e8f0" stroke="#475569" class="box"/>
  <text x="875" y="591" text-anchor="middle" class="box-title">LangSmith</text>
  <text x="875" y="619" text-anchor="middle" class="box-text">Trazas y depuracion</text>

  <path d="M270 458 C300 525 390 535 445 555" class="arrow"/>
  <path d="M600 458 C585 510 545 528 525 555" class="arrow"/>
  <path d="M930 458 C865 520 700 530 615 555" class="arrow"/>
  <path d="M640 601 H745" class="arrow"/>

  <rect x="70" y="590" width="190" height="50" rx="25" fill="#2563eb"/>
  <text x="165" y="621" text-anchor="middle" class="pill">Respuesta final</text>
  <path d="M360 601 H260" class="arrow"/>

  <text x="70" y="686" class="small">Para el video: muestra este diagrama, ejecuta el agente en terminal y despues abre la traza en el proyecto chispa-langgraph de LangSmith.</text>
</svg>
